<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>نظام  إدارة  المياة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fa;
    }

    #meterCropOverlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.94);
      color: #fff;
    }

    #meterCropTop {
      flex: 0 0 auto;
      padding: 14px 18px;
      background: #111;
      text-align: center;
    }

    #meterCropTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #meterCropTopHint {
      font-size: 14px;
      opacity: 0.85;
    }

    #meterCropWorkArea {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #050505;
      touch-action: none;
    }

    #meterCropImage {
      position: absolute;
      display: block;
      max-width: none;
      max-height: none;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 0 0;
      pointer-events: none;
    }

    #meterCropFrame {
      position: absolute;
      border: 2px solid #00e5ff;
      box-shadow:
        0 0 0 99999px rgba(0, 0, 0, 0.58),
        0 0 12px rgba(0, 229, 255, 0.9);
      cursor: move;
      touch-action: none;
    }

    .meter-crop-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to right,
          transparent 32.9%,
          rgba(255,255,255,0.35) 33%,
          transparent 33.1%,
          transparent 66.2%,
          rgba(255,255,255,0.35) 66.3%,
          transparent 66.4%
        ),
        linear-gradient(
          to bottom,
          transparent 32.9%,
          rgba(255,255,255,0.35) 33%,
          transparent 33.1%,
          transparent 66.2%,
          rgba(255,255,255,0.35) 66.3%,
          transparent 66.4%
        );
    }

    .crop-handle {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 3px solid #fff;
      background: #00bcd4;
      border-radius: 50%;
      z-index: 5;
      touch-action: none;
    }

    .crop-handle.tl {
      left: -11px;
      top: -11px;
      cursor: nwse-resize;
    }

    .crop-handle.tr {
      right: -11px;
      top: -11px;
      cursor: nesw-resize;
    }

    .crop-handle.bl {
      left: -11px;
      bottom: -11px;
      cursor: nesw-resize;
    }

    .crop-handle.br {
      right: -11px;
      bottom: -11px;
      cursor: nwse-resize;
    }

    #meterCropBottom {
      flex: 0 0 auto;
      padding: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      background: #111;
    }

    #meterCropBottom button {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      background: #333;
    }

    #meterCropBottom button:hover {
      filter: brightness(1.15);
    }

    #meterCropConfirm {
      background: #00897b !important;
    }

    #meterCropCancel {
      background: #c62828 !important;
    }

    #meterCropReset {
      background: #1565c0 !important;
    }

    #meterCropZoom {
      background: #6a1b9a !important;
    }

    #meterOCRLoading {
      position: fixed;
      inset: 0;
      z-index: 1000000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
    }

    #meterOCRLoadingBox {
      width: min(420px, calc(100vw - 40px));
      padding: 25px;
      border-radius: 15px;
      background: #fff;
      color: #222;
      text-align: center;
      box-shadow: 0 10px 50px rgba(0,0,0,0.4);
    }

    #meterOCRSpinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border: 5px solid #ddd;
      border-top-color: #00897b;
      border-radius: 50%;
      animation: meterSpin 0.9s linear infinite;
    }

    #meterOCRStatus {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.7;
    }

    @keyframes meterSpin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<body>

  <!-- =========================
       CROP OVERLAY
       ========================= -->

  <div id="meterCropOverlay">

    <div id="meterCropTop">
      <div id="meterCropTitle">
        تحديد منطقة أرقام العداد
      </div>

      <div id="meterCropTopHint">
        حرّك الإطار أو كبّر/صغّر الزوايا حتى تغطي شاشة الأرقام فقط
      </div>
    </div>

    <div id="meterCropWorkArea">

      <img id="meterCropImage" alt="meter">

      <div id="meterCropFrame">

        <div class="meter-crop-grid"></div>

        <div
          class="crop-handle tl"
          data-handle="tl">
        </div>

        <div
          class="crop-handle tr"
          data-handle="tr">
        </div>

        <div
          class="crop-handle bl"
          data-handle="bl">
        </div>

        <div
          class="crop-handle br"
          data-handle="br">
        </div>

      </div>

    </div>

    <div id="meterCropBottom">

      <button id="meterCropReset">
        إعادة ضبط
      </button>

      <button id="meterCropZoom">
        تكبير
      </button>

      <button id="meterCropCancel">
        إلغاء
      </button>

      <button id="meterCropConfirm">
        تأكيد القص وبدء القراءة
      </button>

    </div>

  </div>


  <!-- =========================
       OCR LOADING
       ========================= -->

  <div id="meterOCRLoading">

    <div id="meterOCRLoadingBox">

      <div id="meterOCRSpinner"></div>

      <div id="meterOCRStatus">
        جاري قراءة أرقام العداد...
      </div>

    </div>

  </div>


<script>
"use strict";

/* ============================================================
   GLOBAL STATE
   ============================================================ */

let meterCropImageElement = null;
let meterCropSource = null;

let meterCropScale = 1;

let meterCropFrame = {
  left: 0,
  top: 0,
  width: 300,
  height: 120
};

let meterCropInitialFrame = null;

let meterCropDrag = null;

let meterOCRWorker = null;
let meterOCRWorkerPromise = null;

let lastMeterOCRText = "";
let lastMeterOCRReading = "";
let lastMeterOCRRawResults = [];


/* ============================================================
   BASIC HELPERS
   ============================================================ */

function normalizeDigits(value) {
  if (value == null) {
    return "";
  }

  return String(value)
    .replace(/[٠-٩]/g, function(ch) {
      return String(
        ch.charCodeAt(0) - "٠".charCodeAt(0)
      );
    })
    .replace(/[۰-۹]/g, function(ch) {
      return String(
        ch.charCodeAt(0) - "۰".charCodeAt(0)
      );
    });
}


function digitsOnly(value) {
  return normalizeDigits(value)
    .replace(/[^0-9]/g, "");
}


function clamp(value, min, max) {
  return Math.max(
    min,
    Math.min(max, value)
  );
}


function showOCRLoading(message) {
  const overlay =
    document.getElementById("meterOCRLoading");

  const status =
    document.getElementById("meterOCRStatus");

  if (status) {
    status.textContent =
      message || "جاري قراءة أرقام العداد...";
  }

  if (overlay) {
    overlay.style.display = "flex";
  }
}


function hideOCRLoading() {
  const overlay =
    document.getElementById("meterOCRLoading");

  if (overlay) {
    overlay.style.display = "none";
  }
}


/* ============================================================
   LOAD IMAGE
   ============================================================ */

function loadImage(src) {
  return new Promise(function(resolve, reject) {

    const img = new Image();

    img.onload = function() {
      resolve(img);
    };

    img.onerror = function(error) {
      reject(error);
    };

    img.src = src;
  });
}


/* ============================================================
   CROP IMAGE
   ============================================================ */

async function cropMeterImage(imageData) {

  if (!imageData) {
    throw new Error("لم يتم إرسال صورة");
  }

  meterCropSource = imageData;

  const workArea =
    document.getElementById(
      "meterCropWorkArea"
    );

  const imageElement =
    document.getElementById(
      "meterCropImage"
    );

  const frame =
    document.getElementById(
      "meterCropFrame"
    );

  const overlay =
    document.getElementById(
      "meterCropOverlay"
    );

  if (
    !workArea ||
    !imageElement ||
    !frame ||
    !overlay
  ) {
    throw new Error(
      "واجهة القص غير موجودة"
    );
  }

  meterCropImageElement =
    imageElement;

  const sourceImage =
    await loadImage(imageData);

  const areaWidth =
    Math.max(
      300,
      workArea.clientWidth
    );

  const areaHeight =
    Math.max(
      250,
      workArea.clientHeight
    );

  const naturalWidth =
    sourceImage.naturalWidth ||
    sourceImage.width;

  const naturalHeight =
    sourceImage.naturalHeight ||
    sourceImage.height;

  if (
    !naturalWidth ||
    !naturalHeight
  ) {
    throw new Error(
      "أبعاد الصورة غير صحيحة"
    );
  }

  /*
   * Fit image inside the available work area.
   */
  const scaleX =
    areaWidth / naturalWidth;

  const scaleY =
    areaHeight / naturalHeight;

  meterCropScale =
    Math.min(
      scaleX,
      scaleY
    );

  /*
   * Don't make the image too tiny.
   */
  meterCropScale =
    Math.max(
      meterCropScale,
      0.1
    );

  const displayWidth =
    naturalWidth *
    meterCropScale;

  const displayHeight =
    naturalHeight *
    meterCropScale;

  const imageLeft =
    (areaWidth - displayWidth) / 2;

  const imageTop =
    (areaHeight - displayHeight) / 2;

  imageElement.src =
    imageData;

  imageElement.style.width =
    displayWidth + "px";

  imageElement.style.height =
    displayHeight + "px";

  imageElement.style.left =
    imageLeft + "px";

  imageElement.style.top =
    imageTop + "px";

  /*
   * Default crop.
   * Wide rectangle because the meter display
   * usually contains seven digits horizontally.
   */
  const defaultWidth =
    displayWidth * 0.82;

  const defaultHeight =
    Math.max(
      70,
      displayHeight * 0.28
    );

  meterCropFrame = {
    left:
      imageLeft +
      (displayWidth - defaultWidth) / 2,

    top:
      imageTop +
      (displayHeight - defaultHeight) / 2,

    width:
      defaultWidth,

    height:
      defaultHeight
  };

  meterCropInitialFrame =
    Object.assign(
      {},
      meterCropFrame
    );

  updateCropFrame();

  overlay.style.display =
    "flex";

  /*
   * Return a promise that resolves after user confirmation.
   */
  return new Promise(function(resolve, reject) {

    window.__meterCropResolve =
      resolve;

    window.__meterCropReject =
      reject;

    window.__meterCropSourceImage =
      sourceImage;
  });
}


/* ============================================================
   UPDATE CROP FRAME
   ============================================================ */

function updateCropFrame() {

  const frame =
    document.getElementById(
      "meterCropFrame"
    );

  const workArea =
    document.getElementById(
      "meterCropWorkArea"
    );

  if (!frame || !workArea) {
    return;
  }

  const areaWidth =
    workArea.clientWidth;

  const areaHeight =
    workArea.clientHeight;

  const minWidth = 80;
  const minHeight = 45;

  meterCropFrame.width =
    clamp(
      meterCropFrame.width,
      minWidth,
      areaWidth
    );

  meterCropFrame.height =
    clamp(
      meterCropFrame.height,
      minHeight,
      areaHeight
    );

  meterCropFrame.left =
    clamp(
      meterCropFrame.left,
      0,
      areaWidth -
        meterCropFrame.width
    );

  meterCropFrame.top =
    clamp(
      meterCropFrame.top,
      0,
      areaHeight -
        meterCropFrame.height
    );

  frame.style.left =
    meterCropFrame.left + "px";

  frame.style.top =
    meterCropFrame.top + "px";

  frame.style.width =
    meterCropFrame.width + "px";

  frame.style.height =
    meterCropFrame.height + "px";
}


/* ============================================================
   RESET CROP
   ============================================================ */

function resetCrop() {

  if (!meterCropInitialFrame) {
    return;
  }

  meterCropFrame =
    Object.assign(
      {},
      meterCropInitialFrame
    );

  updateCropFrame();
}


/* ============================================================
   ZOOM
   ============================================================ */

function zoomCropImage() {

  if (!meterCropImageElement) {
    return;
  }

  const image =
    meterCropImageElement;

  const oldScale =
    meterCropScale;

  const newScale =
    Math.min(
      oldScale * 1.18,
      5
    );

  if (
    Math.abs(
      newScale - oldScale
    ) < 0.001
  ) {
    return;
  }

  const oldLeft =
    parseFloat(image.style.left) || 0;

  const oldTop =
    parseFloat(image.style.top) || 0;

  const centerX =
    meterCropFrame.left +
    meterCropFrame.width / 2;

  const centerY =
    meterCropFrame.top +
    meterCropFrame.height / 2;

  const sourceX =
    (centerX - oldLeft) /
    oldScale;

  const sourceY =
    (centerY - oldTop) /
    oldScale;

  meterCropScale =
    newScale;

  const newLeft =
    centerX -
    sourceX * newScale;

  const newTop =
    centerY -
    sourceY * newScale;

  image.style.left =
    newLeft + "px";

  image.style.top =
    newTop + "px";

  image.style.width =
    (
      image.naturalWidth *
      newScale
    ) + "px";

  image.style.height =
    (
      image.naturalHeight *
      newScale
    ) + "px";
}


/* ============================================================
   HANDLE CROP POINTER
   ============================================================ */

function getPointerPosition(event) {

  if (
    event.touches &&
    event.touches.length
  ) {
    return {
      x: event.touches[0].clientX,
      y: event.touches[0].clientY
    };
  }

  return {
    x: event.clientX,
    y: event.clientY
  };
}


function beginCropInteraction(
  event,
  type
) {

  event.preventDefault();
  event.stopPropagation();

  const p =
    getPointerPosition(event);

  meterCropDrag = {
    type: type,
    startX: p.x,
    startY: p.y,

    original:
      Object.assign(
        {},
        meterCropFrame
      )
  };
}


function moveCropInteraction(event) {

  if (!meterCropDrag) {
    return;
  }

  event.preventDefault();

  const p =
    getPointerPosition(event);

  const dx =
    p.x -
    meterCropDrag.startX;

  const dy =
    p.y -
    meterCropDrag.startY;

  const o =
    meterCropDrag.original;

  if (
    meterCropDrag.type ===
    "move"
  ) {

    meterCropFrame.left =
      o.left + dx;

    meterCropFrame.top =
      o.top + dy;
  }

  else {

    let left =
      o.left;

    let top =
      o.top;

    let right =
      o.left +
      o.width;

    let bottom =
      o.top +
      o.height;

    if (
      meterCropDrag.type
        .includes("l")
    ) {
      left =
        o.left + dx;
    }

    if (
      meterCropDrag.type
        .includes("r")
    ) {
      right =
        o.left +
        o.width +
        dx;
    }

    if (
      meterCropDrag.type
        .includes("t")
    ) {
      top =
        o.top + dy;
    }

    if (
      meterCropDrag.type
        .includes("b")
    ) {
      bottom =
        o.top +
        o.height +
        dy;
    }

    const minWidth = 80;
    const minHeight = 45;

    if (
      right - left <
      minWidth
    ) {

      if (
        meterCropDrag.type
          .includes("l")
      ) {
        left =
          right - minWidth;
      } else {
        right =
          left + minWidth;
      }
    }

    if (
      bottom - top <
      minHeight
    ) {

      if (
        meterCropDrag.type
          .includes("t")
      ) {
        top =
          bottom - minHeight;
      } else {
        bottom =
          top + minHeight;
      }
    }

    meterCropFrame.left =
      left;

    meterCropFrame.top =
      top;

    meterCropFrame.width =
      right - left;

    meterCropFrame.height =
      bottom - top;
  }

  updateCropFrame();
}


function endCropInteraction() {
  meterCropDrag = null;
}


/* ============================================================
   CREATE FINAL CROPPED IMAGE
   ============================================================ */

async function createFinalCrop() {

  const sourceImage =
    window.__meterCropSourceImage;

  const workArea =
    document.getElementById(
      "meterCropWorkArea"
    );

  if (
    !sourceImage ||
    !workArea
  ) {
    throw new Error(
      "مصدر الصورة غير موجود"
    );
  }

  const imageElement =
    document.getElementById(
      "meterCropImage"
    );

  const displayedLeft =
    parseFloat(
      imageElement.style.left
    ) || 0;

  const displayedTop =
    parseFloat(
      imageElement.style.top
    ) || 0;

  const displayedWidth =
    parseFloat(
      imageElement.style.width
    ) ||
    imageElement.naturalWidth;

  const displayedHeight =
    parseFloat(
      imageElement.style.height
    ) ||
    imageElement.naturalHeight;

  const frame =
    meterCropFrame;

  /*
   * Convert displayed coordinates
   * back to original image coordinates.
   */
  let sourceLeft =
    (
      frame.left -
      displayedLeft
    ) *
    (
      sourceImage.naturalWidth /
      displayedWidth
    );

  let sourceTop =
    (
      frame.top -
      displayedTop
    ) *
    (
      sourceImage.naturalHeight /
      displayedHeight
    );

  let sourceWidth =
    frame.width *
    (
      sourceImage.naturalWidth /
      displayedWidth
    );

  let sourceHeight =
    frame.height *
    (
      sourceImage.naturalHeight /
      displayedHeight
    );

  /*
   * Add small padding around the selected display.
   */
  const padX =
    sourceWidth * 0.025;

  const padY =
    sourceHeight * 0.08;

  sourceLeft -= padX;
  sourceTop -= padY;

  sourceWidth +=
    padX * 2;

  sourceHeight +=
    padY * 2;

  sourceLeft =
    clamp(
      sourceLeft,
      0,
      sourceImage.naturalWidth - 1
    );

  sourceTop =
    clamp(
      sourceTop,
      0,
      sourceImage.naturalHeight - 1
    );

  sourceWidth =
    Math.min(
      sourceWidth,
      sourceImage.naturalWidth -
        sourceLeft
    );

  sourceHeight =
    Math.min(
      sourceHeight,
      sourceImage.naturalHeight -
        sourceTop
    );

  /*
   * IMPORTANT:
   * OCR output must be sufficiently large.
   */
  const targetWidth =
    clamp(
      Math.round(
        sourceWidth * 3.0
      ),
      900,
      3200
    );

  const targetHeight =
    clamp(
      Math.round(
        sourceHeight * 3.0
      ),
      180,
      1200
    );

  const canvas =
    document.createElement("canvas");

  canvas.width =
    targetWidth;

  canvas.height =
    targetHeight;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";

  ctx.drawImage(
    sourceImage,

    sourceLeft,
    sourceTop,
    sourceWidth,
    sourceHeight,

    0,
    0,
    targetWidth,
    targetHeight
  );

  return canvas.toDataURL(
    "image/png"
  );
}


/* ============================================================
   CROP BUTTONS
   ============================================================ */

function confirmCrop() {

  createFinalCrop()
    .then(function(result) {

      const overlay =
        document.getElementById(
          "meterCropOverlay"
        );

      if (overlay) {
        overlay.style.display =
          "none";
      }

      if (
        window.__meterCropResolve
      ) {
        window.__meterCropResolve(
          result
        );
      }

      window.__meterCropResolve =
        null;

      window.__meterCropReject =
        null;
    })
    .catch(function(error) {

      console.error(
        "CROP ERROR:",
        error
      );

      if (
        window.__meterCropReject
      ) {
        window.__meterCropReject(
          error
        );
      }

      window.__meterCropResolve =
        null;

      window.__meterCropReject =
        null;
    });
}


function cancelCrop() {

  const overlay =
    document.getElementById(
      "meterCropOverlay"
    );

  if (overlay) {
    overlay.style.display =
      "none";
  }

  if (
    window.__meterCropReject
  ) {
    window.__meterCropReject(
      new Error(
        "تم إلغاء القص"
      )
    );
  }

  window.__meterCropResolve =
    null;

  window.__meterCropReject =
    null;
}


/* ============================================================
   INIT CROP UI
   ============================================================ */

(function initCropUI() {

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      const frame =
        document.getElementById(
          "meterCropFrame"
        );

      const reset =
        document.getElementById(
          "meterCropReset"
        );

      const zoom =
        document.getElementById(
          "meterCropZoom"
        );

      const cancel =
        document.getElementById(
          "meterCropCancel"
        );

      const confirm =
        document.getElementById(
          "meterCropConfirm"
        );

      if (frame) {

        frame.addEventListener(
          "mousedown",
          function(e) {
            beginCropInteraction(
              e,
              "move"
            );
          }
        );

        frame.addEventListener(
          "touchstart",
          function(e) {
            beginCropInteraction(
              e,
              "move"
            );
          },
          { passive: false }
        );
      }

      document
        .querySelectorAll(
          ".crop-handle"
        )
        .forEach(function(handle) {

          const type =
            handle.dataset.handle;

          handle.addEventListener(
            "mousedown",
            function(e) {
              beginCropInteraction(
                e,
                type
              );
            }
          );

          handle.addEventListener(
            "touchstart",
            function(e) {
              beginCropInteraction(
                e,
                type
              );
            },
            { passive: false }
          );
        });

      window.addEventListener(
        "mousemove",
        moveCropInteraction
      );

      window.addEventListener(
        "touchmove",
        moveCropInteraction,
        { passive: false }
      );

      window.addEventListener(
        "mouseup",
        endCropInteraction
      );

      window.addEventListener(
        "touchend",
        endCropInteraction
      );

      if (reset) {
        reset.addEventListener(
          "click",
          resetCrop
        );
      }

      if (zoom) {
        zoom.addEventListener(
          "click",
          zoomCropImage
        );
      }

      if (cancel) {
        cancel.addEventListener(
          "click",
          cancelCrop
        );
      }

      if (confirm) {
        confirm.addEventListener(
          "click",
          confirmCrop
        );
      }
    }
  );

})();


/* ============================================================
   TESSERACT WORKER
   ============================================================ */

async function getOCRWorker() {

  if (meterOCRWorker) {
    return meterOCRWorker;
  }

  if (meterOCRWorkerPromise) {
    return meterOCRWorkerPromise;
  }

  if (!window.Tesseract) {
    throw new Error(
      "Tesseract.js غير محمل"
    );
  }

  meterOCRWorkerPromise =
    (async function() {

      const worker =
        await Tesseract.createWorker(
          "eng",
          1,
          {
            logger: function(message) {

              if (
                message &&
                message.status
              ) {

                console.log(
                  "TESSERACT:",
                  message.status,
                  message.progress
                );
              }
            }
          }
        );

      await worker.setParameters({

        tessedit_char_whitelist:
          "0123456789",

        user_defined_dpi:
          "300",

        preserve_interword_spaces:
          "1"
      });

      meterOCRWorker =
        worker;

      return worker;
    })();

  try {
    return await meterOCRWorkerPromise;
  }

  finally {
    meterOCRWorkerPromise =
      null;
  }
}


/* ============================================================
   CANVAS HELPERS
   ============================================================ */

function cloneCanvas(source) {

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    source.width;

  canvas.height =
    source.height;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.drawImage(
    source,
    0,
    0
  );

  return canvas;
}


function preprocessCanvas(
  source,
  mode
) {

  if (!source) {
    return null;
  }

  if (
    source.width < 40 ||
    source.height < 12
  ) {
    return null;
  }

  const canvas =
    cloneCanvas(source);

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data =
    imageData.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    let gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;

    if (mode === "contrast") {

      gray =
        (
          gray - 128
        ) * 1.8 +
        128;

      gray =
        clamp(
          gray,
          0,
          255
        );
    }

    else if (
      mode === "threshold"
    ) {

      gray =
        gray < 145
          ? 0
          : 255;
    }

    else if (
      mode === "threshold_dark"
    ) {

      gray =
        gray < 175
          ? 0
          : 255;
    }

    data[i] =
      gray;

    data[i + 1] =
      gray;

    data[i + 2] =
      gray;
  }

  ctx.putImageData(
    imageData,
    0,
    0
  );

  return canvas;
}


/* ============================================================
   SAFE OCR
   ============================================================ */

async function recognizeCanvas(
  canvas,
  psm
) {

  if (!canvas) {
    return null;
  }

  let width =
    Number(canvas.width || 0);

  let height =
    Number(canvas.height || 0);

  /*
   * NEVER send tiny images to Tesseract.
   */
  if (
    width < 40 ||
    height < 12
  ) {

    console.warn(
      "OCR SKIPPED - tiny canvas:",
      width + "x" + height
    );

    return {
      data: {
        text: "",
        confidence: 0,
        symbols: [],
        words: [],
        lines: []
      }
    };
  }

  /*
   * Ensure reasonable OCR dimensions.
   */
  let inputCanvas =
    canvas;

  const MIN_WIDTH = 300;
  const MIN_HEIGHT = 80;

  let scale = 1;

  if (width < MIN_WIDTH) {
    scale =
      Math.max(
        scale,
        MIN_WIDTH / width
      );
  }

  if (height < MIN_HEIGHT) {
    scale =
      Math.max(
        scale,
        MIN_HEIGHT / height
      );
  }

  const MAX_WIDTH = 3200;
  const MAX_HEIGHT = 1400;

  if (
    width * scale >
    MAX_WIDTH
  ) {
    scale =
      MAX_WIDTH / width;
  }

  if (
    height * scale >
    MAX_HEIGHT
  ) {
    scale =
      Math.min(
        scale,
        MAX_HEIGHT / height
      );
  }

  if (
    Math.abs(scale - 1) >
    0.01
  ) {

    const enlarged =
      document.createElement(
        "canvas"
      );

    enlarged.width =
      Math.max(
        40,
        Math.round(
          width * scale
        )
      );

    enlarged.height =
      Math.max(
        12,
        Math.round(
          height * scale
        )
      );

    const ctx =
      enlarged.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );

    ctx.imageSmoothingEnabled =
      true;

    ctx.imageSmoothingQuality =
      "high";

    ctx.drawImage(
      canvas,
      0,
      0,
      enlarged.width,
      enlarged.height
    );

    inputCanvas =
      enlarged;
  }

  if (
    inputCanvas.width < 40 ||
    inputCanvas.height < 12
  ) {
    return {
      data: {
        text: "",
        confidence: 0,
        symbols: [],
        words: [],
        lines: []
      }
    };
  }

  const worker =
    await getOCRWorker();

  try {

    await worker.setParameters({

      tessedit_pageseg_mode:
        String(psm),

      tessedit_char_whitelist:
        "0123456789",

      user_defined_dpi:
        "300",

      preserve_interword_spaces:
        "1"
    });

    return await worker.recognize(
      inputCanvas
    );

  } catch (error) {

    console.warn(
      "OCR recognize error:",
      error
    );

    return {
      data: {
        text: "",
        confidence: 0,
        symbols: [],
        words: [],
        lines: []
      }
    };
  }
}


/* ============================================================
   OCR RESULT HELPERS
   ============================================================ */

function getSymbolList(result) {

  if (
    !result ||
    !result.data
  ) {
    return [];
  }

  return Array.isArray(
    result.data.symbols
  )
    ? result.data.symbols
    : [];
}


function normalizeSymbolText(
  value
) {

  const text =
    digitsOnly(value);

  if (
    text.length !== 1
  ) {
    return null;
  }

  return text;
}


function getResultConfidence(
  result,
  symbol
) {

  if (
    symbol &&
    Number.isFinite(
      Number(
        symbol.confidence
      )
    )
  ) {

    return Number(
      symbol.confidence
    );
  }

  if (
    result &&
    result.data &&
    Number.isFinite(
      Number(
        result.data.confidence
      )
    )
  ) {

    return Number(
      result.data.confidence
    );
  }

  return 0;
}


/* ============================================================
   POSITION CANDIDATES
   ============================================================ */

function collectPositionCandidates(
  result,
  canvasWidth,
  sourceLeft,
  sourceWidth,
  sourceScale,
  collector,
  sourceName
) {

  const symbols =
    getSymbolList(result);

  if (!symbols.length) {
    return;
  }

  const safeScale =
    Number(sourceScale) > 0
      ? Number(sourceScale)
      : 1;

  const safeSourceWidth =
    Number(sourceWidth) > 0
      ? Number(sourceWidth)
      : canvasWidth;

  for (
    const symbol of symbols
  ) {

    const digit =
      normalizeSymbolText(
        symbol.text
      );

    if (!digit) {
      continue;
    }

    const bbox =
      symbol.bbox;

    if (!bbox) {
      continue;
    }

    const left =
      Number(bbox.x0 || 0);

    const right =
      Number(bbox.x1 || left);

    const center =
      (
        left + right
      ) / 2;

    const globalX =
      Number(sourceLeft || 0) +
      center / safeScale;

    const normalizedX =
      globalX /
      safeSourceWidth;

    const confidence =
      getResultConfidence(
        result,
        symbol
      );

    collector.push({

      digit: digit,

      x: globalX,

      normalizedX:
        normalizedX,

      confidence:
        confidence,

      source:
        sourceName || "ocr",

      bbox:
        bbox
    });
  }
}


/* ============================================================
   WORD CANDIDATES
   ============================================================ */

function collectWordCandidates(
  result,
  canvasWidth,
  sourceLeft,
  sourceWidth,
  sourceScale,
  collector,
  sourceName
) {

  if (
    !result ||
    !result.data ||
    !Array.isArray(
      result.data.words
    )
  ) {
    return;
  }

  const safeScale =
    Number(sourceScale) > 0
      ? Number(sourceScale)
      : 1;

  const safeSourceWidth =
    Number(sourceWidth) > 0
      ? Number(sourceWidth)
      : canvasWidth;

  for (
    const word of result.data.words
  ) {

    const text =
      digitsOnly(
        word.text
      );

    if (!text) {
      continue;
    }

    const bbox =
      word.bbox;

    if (!bbox) {
      continue;
    }

    const x0 =
      Number(bbox.x0 || 0);

    const x1 =
      Number(bbox.x1 || x0);

    const center =
      (x0 + x1) / 2;

    const globalX =
      Number(sourceLeft || 0) +
      center / safeScale;

    const normalizedX =
      globalX /
      safeSourceWidth;

    collector.push({

      digitSequence:
        text,

      x:
        globalX,

      normalizedX:
        normalizedX,

      confidence:
        Number(
          word.confidence || 0
        ),

      source:
        sourceName || "word"
    });
  }
}


/* ============================================================
   TEXT SEQUENCE CANDIDATES
   ============================================================ */

function addTextSequenceCandidates(
  sequence,
  sourceLeft,
  sourceWidth,
  totalWidth,
  confidence,
  collector,
  sourceName
) {

  const text =
    digitsOnly(sequence);

  if (!text) {
    return;
  }

  const count =
    text.length;

  for (
    let i = 0;
    i < count;
    i++
  ) {

    const center =
      (
        (i + 0.5) /
        count
      ) *
      sourceWidth;

    const globalX =
      sourceLeft +
      center;

    const normalizedX =
      globalX /
      totalWidth;

    collector.push({

      digit:
        text[i],

      x:
        globalX,

      normalizedX:
        normalizedX,

      confidence:
        confidence,

      source:
        sourceName ||
        "text-sequence"
    });
  }
}


/* ============================================================
   SOLVE SEVEN DIGITS
   ============================================================ */

function solveSevenDigits(
  candidates,
  sourceWidth
) {

  const expected =
    [];

  for (
    let i = 0;
    i < 7;
    i++
  ) {

    expected.push(
      (i + 0.5) / 7
    );
  }

  const positions =
    [];

  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const target =
      expected[i];

    const byDigit =
      {};

    for (
      const candidate of candidates
    ) {

      if (
        !candidate ||
        !candidate.digit
      ) {
        continue;
      }

      const digit =
        String(
          candidate.digit
        );

      if (
        !/^[0-9]$/.test(digit)
      ) {
        continue;
      }

      const x =
        Number(
          candidate.normalizedX
        );

      if (!Number.isFinite(x)) {
        continue;
      }

      const distance =
        Math.abs(
          x - target
        );

      /*
       * Do not allow a digit to be assigned
       * to a completely different position.
       */
      if (
        distance > 0.23
      ) {
        continue;
      }

      const confidence =
        clamp(
          Number(
            candidate.confidence || 0
          ),
          0,
          100
        );

      const proximity =
        Math.max(
          0,
          1 -
          distance / 0.23
        );

      const score =
        confidence * 0.70 +
        proximity * 30;

      if (
        !byDigit[digit]
      ) {
        byDigit[digit] = {
          score: 0,
          count: 0,
          best: candidate
        };
      }

      byDigit[digit].score +=
        score;

      byDigit[digit].count +=
        1;

      if (
        score >
        (
          byDigit[digit]
            .best
            ._score || 0
        )
      ) {

        candidate._score =
          score;

        byDigit[digit].best =
          candidate;
      }
    }

    let bestDigit = null;
    let bestValue = -Infinity;

    Object.keys(
      byDigit
    ).forEach(function(digit) {

      const item =
        byDigit[digit];

      /*
       * Reward repeated observations.
       */
      const totalScore =
        item.score +
        Math.min(
          item.count,
          4
        ) * 8;

      if (
        totalScore >
        bestValue
      ) {

        bestValue =
          totalScore;

        bestDigit =
          digit;
      }
    });

    positions.push({

      digit:
        bestDigit,

      score:
        bestValue
    });
  }

  const reading =
    positions
      .map(function(item) {
        return item.digit || "";
      })
      .join("");

  const complete =
    positions.every(
      function(item) {
        return !!item.digit;
      }
    );

  const partial =
    reading;

  return {

    reading:
      complete
        ? reading
        : "",

    partial:
      partial,

    success:
      complete,

    score:
      positions.reduce(
        function(sum, item) {
          return sum +
            Math.max(
              0,
              item.score || 0
            );
        },
        0
      ),

    positions:
      positions
  };
}


/* ============================================================
   WHOLE DISPLAY OCR
   ============================================================ */

async function runWholeDisplayOCR(
  sourceCanvas
) {

  const candidates =
    [];

  const rawResults =
    [];

  const modes = [
    "normal",
    "contrast",
    "threshold",
    "threshold_dark"
  ];

  const psms = [
    7,
    8,
    13
  ];

  for (
    const mode of modes
  ) {

    const processed =
      preprocessCanvas(
        sourceCanvas,
        mode
      );

    if (!processed) {
      continue;
    }

    for (
      const psm of psms
    ) {

      const result =
        await recognizeCanvas(
          processed,
          psm
        );

      if (!result) {
        continue;
      }

      const text =
        normalizeDigits(
          result.data?.text || ""
        );

      const sequence =
        digitsOnly(text);

      const confidence =
        Number(
          result.data?.confidence || 0
        );

      rawResults.push({

        type:
          "whole",

        mode:
          mode,

        psm:
          psm,

        text:
          text,

        confidence:
          confidence
      });

      /*
       * Direct seven-digit result.
       */
      if (
        sequence.length === 7
      ) {

        candidates.push({

          digitSequence:
            sequence,

          confidence:
            confidence,

          source:
            "whole-direct"
        });
      }

      collectPositionCandidates(
        result,
        processed.width,
        0,
        sourceCanvas.width,
        processed.width /
          sourceCanvas.width,
        candidates,
        "whole-symbol"
      );

      collectWordCandidates(
        result,
        processed.width,
        0,
        sourceCanvas.width,
        processed.width /
          sourceCanvas.width,
        candidates,
        "whole-word"
      );

      /*
       * Add sequence positioning only when
       * it contains at least two digits.
       */
      if (
        sequence.length >= 2 &&
        sequence.length <= 7
      ) {

        addTextSequenceCandidates(
          sequence,
          0,
          sourceCanvas.width,
          sourceCanvas.width,
          confidence,
          candidates,
          "whole-text"
        );
      }
    }
  }

  return {
    candidates:
      candidates,

    rawResults:
      rawResults
  };
}


/* ============================================================
   OVERLAPPING WINDOW OCR
   ============================================================ */

async function runOverlappingWindowOCR(
  sourceCanvas,
  candidates,
  rawResults
) {

  const sourceWidth =
    Number(
      sourceCanvas.width || 0
    );

  const sourceHeight =
    Number(
      sourceCanvas.height || 0
    );

  if (
    sourceWidth < 300 ||
    sourceHeight < 50
  ) {
    return;
  }

  const digitCount = 7;

  const cellWidth =
    sourceWidth /
    digitCount;

  /*
   * Window width measured in digits.
   */
  const windowCells = [
    2.5,
    3.0,
    3.5
  ];

  const starts = [
    0,
    1.0,
    2.0,
    3.0,
    4.0
  ];

  for (
    const cells of windowCells
  ) {

    let desiredWidth =
      Math.round(
        cellWidth *
        cells
      );

    desiredWidth =
      Math.max(
        desiredWidth,
        300
      );

    desiredWidth =
      Math.min(
        desiredWidth,
        sourceWidth
      );

    for (
      const startCell of starts
    ) {

      let left =
        Math.round(
          startCell *
          cellWidth
        );

      left =
        clamp(
          left,
          0,
          Math.max(
            0,
            sourceWidth -
              desiredWidth
          )
        );

      let right =
        Math.min(
          sourceWidth,
          left +
            desiredWidth
        );

      /*
       * CRITICAL:
       * Never allow 1px/2px/3px windows.
       */
      let cropWidth =
        Math.round(
          right - left
        );

      if (
        cropWidth < 80
      ) {
        continue;
      }

      const cropCanvas =
        document.createElement(
          "canvas"
        );

      cropCanvas.width =
        cropWidth;

      cropCanvas.height =
        sourceHeight;

      const ctx =
        cropCanvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );

      if (!ctx) {
        continue;
      }

      ctx.imageSmoothingEnabled =
        true;

      ctx.imageSmoothingQuality =
        "high";

      ctx.drawImage(
        sourceCanvas,

        left,
        0,
        cropWidth,
        sourceHeight,

        0,
        0,
        cropWidth,
        sourceHeight
      );

      /*
       * Upscale the window.
       */
      const upscale =
        Math.max(
          1,
          Math.min(
            3,
            900 /
              cropWidth
          )
        );

      let workingCanvas =
        cropCanvas;

      if (
        upscale > 1.05
      ) {

        const enlarged =
          document.createElement(
            "canvas"
          );

        enlarged.width =
          Math.max(
            80,
            Math.round(
              cropWidth *
              upscale
            )
          );

        enlarged.height =
          Math.max(
            40,
            Math.round(
              sourceHeight *
              upscale
            )
          );

        const ectx =
          enlarged.getContext(
            "2d",
            {
              willReadFrequently:
                true
            }
          );

        ectx.imageSmoothingEnabled =
          true;

        ectx.imageSmoothingQuality =
          "high";

        ectx.drawImage(
          cropCanvas,
          0,
          0,
          enlarged.width,
          enlarged.height
        );

        workingCanvas =
          enlarged;
      }

      const modes = [
        "normal",
        "contrast",
        "threshold"
      ];

      const psms = [
        7,
        8,
        10,
        13
      ];

      for (
        const mode of modes
      ) {

        const processed =
          preprocessCanvas(
            workingCanvas,
            mode
          );

        if (!processed) {
          continue;
        }

        for (
          const psm of psms
        ) {

          const result =
            await recognizeCanvas(
              processed,
              psm
            );

          if (!result) {
            continue;
          }

          const text =
            normalizeDigits(
              result.data?.text ||
              ""
            );

          const sequence =
            digitsOnly(text);

          const confidence =
            Number(
              result.data?.confidence ||
              0
            );

          rawResults.push({

            type:
              "window",

            mode:
              mode,

            psm:
              psm,

            left:
              left,

            width:
              cropWidth,

            text:
              text,

            confidence:
              confidence
          });

          collectPositionCandidates(
            result,

            processed.width,

            left,

            cropWidth,

            processed.width /
              cropWidth,

            candidates,

            "window-symbol"
          );

          collectWordCandidates(
            result,

            processed.width,

            left,

            cropWidth,

            processed.width /
              cropWidth,

            candidates,

            "window-word"
          );

          if (
            sequence.length >= 2 &&
            sequence.length <= 7
          ) {

            addTextSequenceCandidates(
              sequence,

              left,

              cropWidth,

              sourceWidth,

              confidence,

              candidates,

              "window-text"
            );
          }
        }
      }
    }
  }
}


/* ============================================================
   MAIN METER OCR
   ============================================================ */

async function recognizeMeterDigits(
  imageData
) {

  showOCRLoading(
    "جاري تجهيز صورة العداد..."
  );

  lastMeterOCRText =
    "";

  lastMeterOCRReading =
    "";

  lastMeterOCRRawResults =
    [];

  try {

    const image =
      await loadImage(
        imageData
      );

    /*
     * Create a large source canvas.
     */
    const naturalWidth =
      image.naturalWidth ||
      image.width;

    const naturalHeight =
      image.naturalHeight ||
      image.height;

    if (
      naturalWidth < 100 ||
      naturalHeight < 50
    ) {
      throw new Error(
        "الصورة صغيرة جدًا"
      );
    }

    /*
     * Limit the source size but keep
     * enough resolution for OCR.
     */
    const maxWidth = 3200;

    let scale =
      Math.min(
        1,
        maxWidth /
          naturalWidth
      );

    /*
     * If the original image is already
     * small, enlarge it.
     */
    if (
      naturalWidth < 1400
    ) {
      scale =
        Math.max(
          scale,
          1400 /
            naturalWidth
        );
    }

    scale =
      Math.min(
        scale,
        3
      );

    const sourceCanvas =
      document.createElement(
        "canvas"
      );

    sourceCanvas.width =
      Math.max(
        300,
        Math.round(
          naturalWidth *
          scale
        )
      );

    sourceCanvas.height =
      Math.max(
        100,
        Math.round(
          naturalHeight *
          scale
        )
      );

    const ctx =
      sourceCanvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );

    ctx.imageSmoothingEnabled =
      true;

    ctx.imageSmoothingQuality =
      "high";

    ctx.drawImage(
      image,
      0,
      0,
      sourceCanvas.width,
      sourceCanvas.height
    );

    showOCRLoading(
      "جاري قراءة شاشة الأرقام..."
    );

    const whole =
      await runWholeDisplayOCR(
        sourceCanvas
      );

    const candidates =
      whole.candidates || [];

    const rawResults =
      whole.rawResults || [];

    /*
     * Save all whole OCR text.
     */
    lastMeterOCRRawResults =
      rawResults.slice();

    lastMeterOCRText =
      rawResults
        .map(function(item) {
          return item.text || "";
        })
        .filter(Boolean)
        .join(" | ");

    /*
     * First try direct 7-digit OCR.
     */
    const direct =
      candidates.filter(
        function(item) {
          return (
            item &&
            item.digitSequence &&
            digitsOnly(
              item.digitSequence
            ).length === 7
          );
        }
      );

    if (direct.length) {

      direct.sort(
        function(a, b) {
          return (
            Number(
              b.confidence || 0
            ) -
            Number(
              a.confidence || 0
            )
          );
        }
      );

      const best =
        digitsOnly(
          direct[0]
            .digitSequence
        );

      if (
        best.length === 7
      ) {

        lastMeterOCRReading =
          best;

        return {
          reading:
            best,

          text:
            lastMeterOCRText,

          success:
            true,

          rawResults:
            rawResults
        };
      }
    }

    /*
     * Try position solving before windows.
     */
    let solution =
      solveSevenDigits(
        candidates,
        sourceCanvas.width
      );

    if (
      solution.success
    ) {

      lastMeterOCRReading =
        solution.reading;

      return {
        reading:
          solution.reading,

        text:
          lastMeterOCRText,

        success:
          true,

        rawResults:
          rawResults
      };
    }

    /*
     * Now use overlapping windows.
     */
    showOCRLoading(
      "جاري تحليل الأرقام بشكل أدق..."
    );

    await runOverlappingWindowOCR(
      sourceCanvas,
      candidates,
      rawResults
    );

    /*
     * Try again.
     */
    solution =
      solveSevenDigits(
        candidates,
        sourceCanvas.width
      );

    if (
      solution.success
    ) {

      lastMeterOCRReading =
        solution.reading;

      lastMeterOCRRawResults =
        rawResults;

      lastMeterOCRText =
        rawResults
          .map(function(item) {
            return item.text || "";
          })
          .filter(Boolean)
          .join(" | ");

      return {
        reading:
          solution.reading,

        text:
          lastMeterOCRText,

        success:
          true,

        rawResults:
          rawResults
      };
    }

    /*
     * Last fallback:
     * search for any seven-digit sequence
     * returned by Tesseract.
     */
    const sequences =
      candidates
        .filter(function(item) {
          return (
            item &&
            item.digitSequence
          );
        })
        .map(function(item) {
          return {
            value:
              digitsOnly(
                item.digitSequence
              ),

            confidence:
              Number(
                item.confidence || 0
              )
          };
        })
        .filter(function(item) {
          return (
            item.value.length === 7
          );
        })
        .sort(function(a, b) {
          return (
            b.confidence -
            a.confidence
          );
        });

    if (sequences.length) {

      lastMeterOCRReading =
        sequences[0].value;

      return {
        reading:
          sequences[0].value,

        text:
          lastMeterOCRText,

        success:
          true,

        rawResults:
          rawResults
      };
    }

    /*
     * Failed.
     */
    lastMeterOCRRawResults =
      rawResults;

    return {
      reading:
        "",

      text:
        lastMeterOCRText,

      success:
        false,

      rawResults:
        rawResults
    };

  } catch (error) {

    console.error(
      "METER OCR ERROR:",
      error
    );

    return {
      reading:
        "",

      text:
        "",

      success:
        false,

      rawResults:
        lastMeterOCRRawResults,

      error:
        String(error)
    };

  } finally {

    hideOCRLoading();
  }
}


/* ============================================================
   GENERAL OCR
   ============================================================ */

async function recognizeText(
  imageData
) {

  const result =
    await recognizeMeterDigits(
      imageData
    );

  if (
    result &&
    result.reading
  ) {
    return result.reading;
  }

  return result
    ? result.text || ""
    : "";
}


/* ============================================================
   GETTERS
   ============================================================ */

function getLastMeterOCRText() {
  return lastMeterOCRText;
}


function getLastMeterOCRReading() {
  return lastMeterOCRReading;
}


function getLastMeterOCRRawResults() {
  return lastMeterOCRRawResults;
}


/* ============================================================
   GLOBAL API
   ============================================================ */

window.cropMeterImage =
  cropMeterImage;

window.recognizeMeterDigits =
  recognizeMeterDigits;

window.recognizeText =
  recognizeText;

window.getLastMeterOCRText =
  getLastMeterOCRText;

window.getLastMeterOCRReading =
  getLastMeterOCRReading;

window.getLastMeterOCRRawResults =
  getLastMeterOCRRawResults;

window.getOCRWorker =
  getOCRWorker;


/* ============================================================
   FLUTTER
   ============================================================ */

</script>
